# Local development stack. Ports bind to loopback only.
#   docker compose up -d
#   $env:QT_TEST_DATABASE_URL="postgresql://quantterm:<password>@127.0.0.1:5432/quantterm"; pytest -m integration
services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: quantterm
      POSTGRES_DB: quantterm
      POSTGRES_PASSWORD: ${QT_PG_PASSWORD:?set QT_PG_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantterm -d quantterm"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

volumes:
  pgdata:
  redisdata:
